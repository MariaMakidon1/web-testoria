name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    name: Deploy to EC2 (host nginx)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production SPA
        run: npm run build -- --mode prod

      # Upload the build artifact + the host vhost to a staging dir in the
      # deploy user's home (no sudo needed for scp).
      - name: Upload dist and vhost to host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/**,deploy/web.vhost.conf"
          target: "~/web-staging/${{ github.sha }}"
          strip_components: 0
          overwrite: true

      # Install the release: move dist into /var/www, flip the `current` symlink,
      # refresh the vhost, validate and reload nginx.
      # Prereq (one-time, see deploy runbook): the deploy user has passwordless
      # sudo for `nginx`, `systemctl reload nginx`, `install`, `ln`, `rsync`,
      # `mkdir`, `rm` under /var/www/testoria and /etc/nginx.
      - name: Install release and reload nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: RELEASE
          script: |
            set -euo pipefail
            STAGING="$HOME/web-staging/$RELEASE"
            RELEASE_DIR="/var/www/testoria/releases/$RELEASE"

            # Publish the static files.
            sudo mkdir -p "$RELEASE_DIR"
            sudo rsync -a --delete "$STAGING/dist/" "$RELEASE_DIR/"
            sudo ln -sfn "$RELEASE_DIR" /var/www/testoria/current

            # Refresh the vhost (idempotent) and ensure it is enabled.
            sudo install -m 0644 "$STAGING/deploy/web.vhost.conf" \
              /etc/nginx/sites-available/web.vhost.conf
            sudo ln -sfn /etc/nginx/sites-available/web.vhost.conf \
              /etc/nginx/sites-enabled/web.vhost.conf

            # Validate and reload (reload is zero-downtime; aborts if config invalid).
            sudo nginx -t
            sudo systemctl reload nginx

            # Verify the site is up, then prune old releases (keep last 5).
            curl --fail --retry 5 --retry-delay 2 --retry-all-errors https://testoria.gammait.net/health
            ls -1dt /var/www/testoria/releases/*/ | tail -n +6 | sudo xargs -r rm -rf
            rm -rf "$HOME/web-staging/$RELEASE"
        env:
          RELEASE: ${{ github.sha }}
