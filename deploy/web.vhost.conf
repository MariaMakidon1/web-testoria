# Testoria Web (SPA) — host-level nginx vhost (owned by web-testoria).
# Deployed to /etc/nginx/sites-available/web.vhost.conf and symlinked into
# sites-enabled/. nginx serves the built dist/ straight from disk; there is no
# web container. CI rsyncs dist/ to /var/www/testoria/<release>/ and flips the
# `current` symlink.
#
# Cert: issued once on the host with
#   sudo certbot certonly --nginx -d testoria-test.gammait.net

# ─── HTTP: redirect to HTTPS ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name testoria-test.gammait.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Used by deploy health checks — must not redirect.
    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS: frontend (testoria-test.gammait.net) ───────────────────────────
server {
    # HTTP/2 via the listen parameter (compatible with nginx < 1.25.1; the
    # standalone `http2 on;` directive is only valid on 1.25.1+).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name testoria-test.gammait.net;

    ssl_certificate     /etc/letsencrypt/live/testoria-test.gammait.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testoria-test.gammait.net/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/testoria-test.gammait.net/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # SPA artifact served from disk (CI keeps `current` pointing at the release).
    root /var/www/testoria/current;
    index index.html;

    # Health check endpoint.
    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Security headers (folded in from the former inner nginx.conf).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets aggressively (Vite adds content hashes to filenames).
    location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never cache index.html (so new deployments are picked up immediately).
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA fallback — all routes serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;
}
